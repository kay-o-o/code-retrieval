[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-coding-agent-ollama"
version = "0.1.0"
description = "Minimal standalone coding agent backed by Ollama"
requires-python = ">=3.10"
# 运行时不依赖第三方库：检索、融合、HTTP 全部走标准库。
# 评测与 lint 依赖见下方 dev 组。
dependencies = []

[project.scripts]
mini-coding-agent = "mini_coding_agent:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
py-modules = ["mini_coding_agent", "code_index"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# 显式固定规则集。CI 装的是不锁版本的 ruff，而较新版本会扩大默认规则范围，
# 结果就是上游那段没动过的代码被判失败。写死以后，lint 只报「这段代码的问题」，
# 不报「ruff 又加了什么规矩」。
select = ["E4", "E7", "E9", "F"]
